name: foundation-local-verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - foundation/engineering-complete
  pull_request:
    branches:
      - main

concurrency:
  group: foundation-local-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem .\scripts -Recurse -File -Filter *.ps1)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = $errors | ForEach-Object { "$($_.Message) at line $($_.Extent.StartLineNumber)" }
              throw "PowerShell syntax error(s) in $($file.FullName): $($details -join '; ')"
            }
          }
          Write-Host "PowerShell parser gate passed."

      - name: Canonical local Foundation verification
        shell: pwsh
        run: .\scripts\verify.ps1
  ef-model-diagnostic:
    if: ${{ always() }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore and build Server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool restore
          dotnet restore src\\Server\\GameNet.Server.csproj
          dotnet build src\\Server\\GameNet.Server.csproj --configuration Release --no-restore

      - name: Generate EF diagnostic migration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts\\ef-diagnostic | Out-Null
          dotnet ef migrations add "__DiagnosticPendingModel" `
            --project "src\\Server\\GameNet.Server.csproj" `
            --startup-project "src\\Server\\GameNet.Server.csproj" `
            --configuration Release `
            --output-dir "artifacts\\ef-diagnostic" `
            --namespace "GameNet.Server.Persistence.Migrations.Diagnostic"
          Get-ChildItem artifacts\\ef-diagnostic -File |
            ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName
            }

      - name: Upload EF diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ef-model-diagnostic
          path: artifacts/ef-diagnostic
          if-no-files-found: warn

