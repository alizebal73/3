name: GameNet 3 CI

on:
  push:
    branches: [main, develop, foundation/platform-hardening, foundation/hardening]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: gamenet3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Verify toolchain
        shell: pwsh
        run: |
          dotnet --info
          node --version
          npm --version

      - name: Architecture guard
        shell: pwsh
        run: ./scripts/check-architecture.ps1

      - name: Source-size guard
        shell: pwsh
        run: ./scripts/check-source-size.ps1

      - name: Foundation completeness
        shell: pwsh
        run: ./scripts/check-foundation-completeness.ps1

      - name: Restore EF tool
        shell: pwsh
        run: dotnet tool restore

      - name: Restore
        shell: pwsh
        run: dotnet restore GameNet.slnx

      - name: Build
        shell: pwsh
        run: dotnet build GameNet.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test GameNet.slnx --configuration Release --no-build --no-restore

      - name: Dashboard
        shell: pwsh
        run: ./scripts/verify-dashboard.ps1
